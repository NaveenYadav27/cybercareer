<style>
:root{--red:#d71920;--ink:#121212;--muted:#646464;--line:#d8d8d8;--soft:#f5f5f5;--paper:#fff;--green:#177b3b}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,Arial,sans-serif}
button,a{font:inherit}
.top{height:68px;border-bottom:2px solid var(--red);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:30;background:#fff}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;cursor:pointer}
.brand img{height:42px;border-radius:6px;object-fit:contain}
.brandText{font-weight:900;letter-spacing:.08em;font-size:15px}
.brandText span{color:var(--red)}
.topActions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid #bbb;background:#fff;padding:9px 13px;border-radius:6px;cursor:pointer;text-decoration:none;color:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn:hover{border-color:var(--red)}
.btn.red:hover{background:#b51319}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 68px)}
.sidebar{border-right:1px solid var(--line);background:#fbfbfb;height:calc(100vh - 68px);position:sticky;top:68px;overflow:auto;padding:16px 12px}
.kicker,.mini{font:700 10px Consolas,monospace;letter-spacing:.16em;color:var(--red);text-transform:uppercase}
.sideHead{padding:0 7px 12px;border-bottom:1px solid #ddd}
.sideHead b{font-size:17px;display:block;margin-top:5px}
.sideNavLinks{display:grid;gap:4px;margin-top:10px;padding-bottom:10px;border-bottom:1px solid #ddd}
.sideNavLink{border:1px solid transparent;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none}
.sideNavLink:hover,.sideNavLink.active{background:#eee;border-color:#ccc}
.sideNavLink.simLink{background:#fff3f3;border-color:#ffcccc;color:var(--red)}
.sideNavLink.simLink:hover{background:#ffe3e3}
.progress{height:5px;background:#e5e5e5;margin-top:12px;border-radius:4px;overflow:hidden}
.progress i{display:block;width:4.2%;height:100%;background:var(--red)}
.moduleList{margin-top:12px;display:grid;gap:4px}
.moduleNav{border:0;background:transparent;text-align:left;padding:10px 9px;border-radius:6px;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:5px}
.moduleNav:hover{background:#eee}
.moduleNav.active{background:#eee;border-left:3px solid var(--red);padding-left:6px}
.moduleNav .n{font:700 11px Consolas;color:var(--red)}
.moduleNav .t{font-size:12px;font-weight:700}
.moduleNav .s{font-size:10px;color:#777;grid-column:2}
main{min-width:0}
.view{padding:38px 42px 90px;max-width:1500px;margin:auto}
.overviewHero{padding-bottom:30px;border-bottom:1px solid var(--line)}
h1{font-size:46px;line-height:1.05;margin:10px 0 13px;max-width:1050px}
h2{font-size:28px;margin:0 0 9px}
h3{margin:0 0 8px}
.lead{font-size:17px;line-height:1.65;color:#444;max-width:1050px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0}
.pill{border:1px solid #ccc;padding:5px 9px;border-radius:20px;font:10px Consolas}
.tabBar{display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid #ccc;margin:28px 0 22px}
.tab{border:1px solid #ccc;border-bottom:0;background:#f1f1f1;padding:11px 15px;border-radius:6px 6px 0 0;cursor:pointer}
.tab.active{background:#fff;color:var(--red);font-weight:900;border-top:2px solid var(--red)}
.panel{display:none}.panel.active{display:block}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.card{border:1px solid #ccc;border-radius:9px;padding:17px;background:#fff}
.card h3{font-size:16px}
.card p,.card li{font-size:13px;line-height:1.55;color:#555}
.topic{border-left:4px solid var(--red);background:var(--soft);padding:11px;margin:8px 0}
.topic b{font-size:13px}.topic small{display:block;color:#666;margin-top:4px}
.toolGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tool{border:1px solid #ccc;border-radius:9px;padding:14px;background:#fff}
.tool b{display:block;font-size:14px}.tool code{font:11px Consolas;color:#555;line-height:1.6}
.terminal{background:#0e0e0e;color:#eee;border-radius:9px;padding:17px;font:13px/1.7 Consolas;min-height:260px;white-space:pre-wrap}
.terminal .redtxt{color:#ff5555}
.lab{border:1px solid #ccc;border-radius:9px;padding:18px}
.target{background:#f7f7f7;border:1px dashed #aaa;border-radius:7px;padding:13px;font:12px Consolas;margin:10px 0}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid #bbb;border-radius:6px;padding:10px;margin:7px 0;cursor:pointer}
.choice:hover{border-color:var(--red)}
.feedback{border-left:4px solid var(--red);background:#f5f5f5;padding:11px;font-size:12px;margin-top:10px}
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{padding:12px;border:1px solid #ddd;background:#fafafa;border-radius:6px;margin:6px 0;font-size:12px}
.modulePicker{padding:38px 42px}
.moduleGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.moduleCard{border:1px solid #ccc;background:#fff;text-align:left;padding:17px;border-radius:9px;cursor:pointer;min-height:185px;position:relative}
.moduleCard:hover{border-color:var(--red);transform:translateY(-1px)}
.moduleIcon{font-size:30px}.moduleNum{font:700 10px Consolas;color:var(--red);margin-top:10px}
.moduleTitle{font-size:16px;font-weight:900;margin:6px 0}
.moduleTrack{font-size:11px;color:#666}
.moduleTopics{font:10px Consolas;color:var(--red);font-weight:700;margin-top:14px}
.mentor{display:none;position:fixed;right:20px;bottom:20px;width:400px;max-width:calc(100vw - 40px);background:#fff;border:2px solid var(--red);border-radius:10px;box-shadow:0 20px 60px #0004;z-index:100}
.mentor.open{display:block}
.mentorHead{padding:12px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
.mentorBody{padding:15px}
.close{border:0;background:none;color:var(--red);font-weight:900;cursor:pointer}
.curriculumHero{padding:34px 28px 22px;border-bottom:1px solid #ddd}
.curriculumHero h1{font-size:44px;margin:6px 0 8px}
.curriculumHero .lead{max-width:1000px}
.phaseStrip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:22px}
.phase{border:1px solid #d3d3d3;padding:12px;background:#fafafa;min-height:80px}
.phase b{display:block;font-size:11px;color:#e21b23}
.phase span{font-size:12px}
.curriculumSection{padding:22px 28px}
.curriculumSection h2{font-size:26px}
.detailGoal{border-left:4px solid #e21b23;background:#fafafa;padding:16px 18px;margin:12px 0 18px}
.visualPath{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:14px;overflow:auto}
.visualStep{min-width:190px;border:1px solid #ccc;padding:18px;background:#fff;position:relative}
.visualStep:not(:last-child){border-right:0}
.visualStep .stepNo{color:#e21b23;font:700 11px Consolas}
.visualStep h3{font-size:17px;margin:6px 0}
.visualStep p{font-size:13px;color:#555;margin:0}
.visualStep:after{content:"→";position:absolute;right:-14px;top:45%;background:#fff;color:#e21b23;font-size:20px;z-index:2}
.learningCards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.learningCard{border:1px solid #ccc;padding:16px;background:#fff}
.learningCard .num{color:#e21b23;font:700 11px Consolas}
.learningCard h3{margin:5px 0 7px;font-size:17px}
.learningCard p{margin:0;color:#555;font-size:13px}
.toolReal{border:1px solid #ccc;background:#fff;padding:15px}
.toolReal h3{margin:0 0 7px}
.toolReal code{display:block;background:#111;color:#fff;padding:10px;margin-top:10px;white-space:pre-wrap;font-size:12px}
.labMission{border:2px solid #e21b23;background:#fff;padding:20px}
.missionSteps{display:grid;gap:8px}
.missionStep{border:1px solid #ddd;padding:12px}
.missionStep b{color:#e21b23}
.evidenceChecklist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.evidenceItem{border:1px solid #ddd;padding:12px;background:#fafafa}

.dashboardHero{padding:42px 32px 28px;background:#fff;border-bottom:1px solid #d9d9d9}
.dashboardHero h1{font-size:42px;line-height:1.08;margin:8px 0 10px}
.dashboardHero h1 span{color:#e21b23}
.dashboardLead{max-width:860px;font-size:18px;line-height:1.55;color:#444}
.dashboardActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.dashBtn{padding:12px 17px;border:1px solid #111;background:#111;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.dashBtn.primary{background:#e21b23;border-color:#e21b23}
.dashBtn.light{background:#fff;color:#111}
.dashboardSection{padding:28px 32px;border-bottom:1px solid #ddd}
.dashboardSection h2{font-size:28px;margin:6px 0 8px}
.dashboardGrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:18px}
.dashPanel{border:1px solid #ccc;background:#fff;padding:20px}
.dashPanel h3{margin:0 0 15px;font-size:18px}
.progressBar{height:12px;background:#eee;border:1px solid #ddd;overflow:hidden}
.progressFill{height:100%;background:#e21b23;width:0;transition:width .3s}
.phaseRows{display:grid;gap:10px}
.phaseRow{display:grid;grid-template-columns:105px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.phaseRow b{font:700 11px Consolas;color:#e21b23}
.phasePct{text-align:right;font-weight:700}
.readinessList{display:grid;gap:9px}
.readinessItem{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #ddd;background:#fafafa;cursor:pointer}
.readinessItem input{margin-top:3px;accent-color:#e21b23}
.readinessItem span{font-size:13px;line-height:1.35}
.readinessItem.done{background:#f4f4f4;text-decoration:line-through;color:#666}
.activityList{display:grid;gap:8px}
.activity{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee;padding:9px 0;font-size:13px}
.activity time{font:11px Consolas;color:#777}
.dashboardEmpty{padding:22px;border:1px dashed #bbb;color:#666;background:#fafafa}

.sxlCommandHero{background:linear-gradient(135deg,var(--sxl-panel,#fff),var(--sxl-soft,#f7f7f7));border-bottom:1px solid var(--sxl-line,#d7d7d7);padding:38px 34px 30px}
.sxlCommandHero .routeTag{font:700 10px Consolas;color:var(--red);letter-spacing:2px}
.sxlCommandHero h1{font-size:44px;line-height:1.05;margin:8px 0}
.sxlCommandHero h1 span{color:var(--red)}
.sxlCommandHero p{max-width:850px;font-size:17px;line-height:1.55;color:var(--muted)}
.sxlMetricGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:20px 34px}
.sxlMetric{border:1px solid var(--line);background:#fff;padding:16px}
.sxlMetric b{display:block;font-size:28px}.sxlMetric small{color:var(--muted)}
.sxlFlow{display:grid;grid-template-columns:repeat(6,1fr);padding:0 34px 24px;gap:8px}
.sxlFlow .node{position:relative;border:1px solid var(--line);background:#fff;padding:15px 12px}
.sxlFlow .node:not(:last-child):after{content:"→";position:absolute;right:-8px;top:36%;z-index:2;color:var(--red);background:#fff;padding:0 2px}
.sxlFlow .node b{font:700 10px Consolas;color:var(--red)}.sxlFlow .node strong{display:block;margin-top:5px;font-size:13px}
.sxlContentGrid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;padding:0 34px 30px}
.sxlPanel{border:1px solid var(--line);background:#fff;padding:20px}
.sxlPanel h2{font-size:20px;margin:0 0 13px}.sxlPanel p{color:var(--muted);line-height:1.5}
.sxlQuickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.sxlQuick{border:1px solid var(--line);background:var(--soft);padding:14px;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none;display:block}
.sxlQuick:hover{border-color:var(--red)}.sxlQuick b{display:block;color:var(--red);font:700 10px Consolas}.sxlQuick strong{display:block;margin-top:4px}
.sxlReadinessMap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sxlReadinessMap .r{border:1px solid var(--line);padding:12px;background:var(--soft);font-size:12px}
.sxlReadinessMap .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:6px}
.sxlReadinessMap .done .dot{background:var(--red)}

.simPromoCard{border:2px solid var(--red);background:linear-gradient(120deg,#fff,#fff6f5);border-radius:10px;padding:22px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.simPromoCard h3{font-size:22px;margin:4px 0 6px;color:var(--ink)}
.simPromoCard p{margin:0;color:#555;font-size:14px;max-width:750px}

/* Theme & Sidebar Controls */
body.sxl-dark{background:#090909;color:#f5f5f5}
body.sxl-dark .top{background:#111;border-color:#e21b23}
body.sxl-dark .sidebar{background:#0d0d0d;border-color:#303030}

body.sxl-dark .curriculumHero,body.sxl-dark .curriculumSection,body.sxl-dark .dashPanel,

.sxl-controls{position:fixed;top:14px;right:18px;z-index:10000;display:flex;gap:7px;background:#fff;border:1px solid #ccc;padding:5px;border-radius:8px}
body.sxl-dark .sxl-controls{background:#111;border-color:#333}
.sxl-control{width:36px;height:32px;border:1px solid #ccc;background:transparent;color:inherit;cursor:pointer;border-radius:5px;font-size:15px;display:flex;align-items:center;justify-content:center}
body.sxl-dark .sxl-control{border-color:#333}
.sxl-sidebar-toggle{position:fixed!important;top:16px!important;left:calc(320px - 46px)!important;z-index:10001!important;width:36px;height:32px;border:1px solid #ccc;background:#fff;color:inherit;border-radius:6px;cursor:pointer}
body.sxl-dark .sxl-sidebar-toggle{background:#111;border-color:#333}
body.sxl-sidebar-collapsed .layout{grid-template-columns:0 minmax(0,1fr)!important}
body.sxl-sidebar-collapsed .layout > .sidebar{display:none!important}
body.sxl-sidebar-collapsed .sxl-sidebar-toggle{left:10px!important}

@media(max-width:1100px){.moduleGrid{grid-template-columns:repeat(3,1fr)}.sxlFlow{grid-template-columns:repeat(3,1fr)}.sxlContentGrid{grid-template-columns:1fr}.sxlMetricGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:850px){.layout{display:block}.sidebar{position:static;height:auto}.view,.modulePicker{padding:25px 16px}h1{font-size:36px}.visualPath,.learningCards,.evidenceChecklist,.sxlQuickGrid,.sxlReadinessMap,.grid2,.grid3{grid-template-columns:1fr}.visualStep:after{display:none}.moduleGrid{grid-template-columns:1fr 1fr}.sxlFlow{grid-template-columns:1fr 1fr;padding:0 18px 20px}.sxlMetricGrid,.sxlContentGrid{padding-left:18px;padding-right:18px}}
@media(max-width:550px){.moduleGrid,.phaseStrip{grid-template-columns:1fr}.topActions .btn:not(.red){display:none}}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getModule(n){return MODULES.find(m=>m.num===n)||MODULES[0]}

function renderSidebar(){
  const list=document.getElementById("moduleList");
  list.innerHTML=MODULES.map(m=>`
    <button class="moduleNav ${m.num===currentModule?'active':''}" data-route="${m.num}" onclick="openModule('${m.num}')">
      <span class="n">${m.num}</span><span class="t">${esc(m.title)}</span>
      <span class="s">${esc(m.track)}</span>
    </button>`).join("");
  document.getElementById("sideTitle").textContent="Module "+currentModule;
  document.getElementById("progressBar").style.width=(Number(currentModule)/24*100)+"%";
}

function openModule(num, updateHash=true){
  const m=getModule(num);
  currentModule=m.num;
  currentTab="overview";
  renderSidebar();
  renderModule(m);
  if(updateHash) history.pushState({module:m.num},"","#module-"+m.num);
  window.scrollTo({top:0,behavior:"smooth"});
}

function setTab(tab){
 currentTab=tab;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id==="panel-"+tab));
 const hash="#module-"+currentModule+"-"+tab;
 history.replaceState({module:currentModule,tab},"",hash);
}

function labChoice(n){
 const f=document.getElementById("labFeedback"); if(!f)return;
 f.textContent=n===1?"✓ Correct. Start by identifying the information required by the objective. That decision drives the tool and the evidence.":"✕ Not the recommended first move. Follow the visual workflow: scope → question → technique → result → interpretation → evidence.";
}

const SXL_PROGRESS_KEY="sxl_pen200_progress_v5";
function getProgress(){
  try{return JSON.parse(localStorage.getItem(SXL_PROGRESS_KEY))||{completed:{},readiness:{},activity:[]};}
  catch(e){return {completed:{},readiness:{},activity:[]};}
}
function saveProgress(p){localStorage.setItem(SXL_PROGRESS_KEY,JSON.stringify(p));}
function completedCount(){
  const p=getProgress(); return Object.keys(p.completed||{}).filter(k=>p.completed[k]).length;
}
function readinessCount(){
  const p=getProgress(); return Object.keys(p.readiness||{}).filter(k=>p.readiness[k]).length;
}
function logActivity(text){
  const p=getProgress(); p.activity=p.activity||[];
  p.activity.unshift({text,ts:new Date().toLocaleString()});
  p.activity=p.activity.slice(0,12); saveProgress(p);
}
function overallPct(){
  return Math.round((completedCount()/24)*100);
}
function setModuleComplete(num){
  const p=getProgress(); p.completed=p.completed||{};
  p.completed[num]=true; saveProgress(p);
  logActivity("Completed Module "+num);
  showDashboard();
}
function toggleReadiness(key, checked){
  const p=getProgress(); p.readiness=p.readiness||{}; p.readiness[key]=checked; saveProgress(p);
  renderReadiness();
}

function route(){
 const h=location.hash||"#home";
 if(h==="#home"){showHome();return} if(h==="#dashboard"){showDashboard();return} if(h==="#readiness"){showReadinessPage();return} if(h==="#modules"){showCatalogue();return}
 const m=h.match(/^#module-(\d{2})(?:-(\w+))?$/);
 if(!m){showHome();return}
 openModule(m[1],false);
 if(m[2] && ["overview","visual","tools","lab","evidence"].includes(m[2])) setTab(m[2]);
}

window.addEventListener("popstate",route);
window.addEventListener("hashchange",route);
renderSidebar();
route();

const _openModuleOriginal=openModule;
openModule=function(num){
  _openModuleOriginal(num);
  setTimeout(()=>{
    const app=document.getElementById("app");
    if(!app || app.querySelector(".completeModuleBtn"))return;
    const m=MODULES.find(x=>x.num===num); if(!m)return;
    const p=getProgress();
    const wrap=document.createElement("div");
    wrap.className="dashboardSection";
    wrap.innerHTML=`<div class="kicker">PRACTICAL MILESTONE</div>
      <h2>Module completion</h2>
      <p style="color:#555">Mark this module complete only after you have worked through its concepts, tools, lab and evidence workflow.</p>
      <button class="dashBtn ${p.completed?.[num]?'light':'primary'} completeModuleBtn" onclick="setModuleComplete('${num}')">${p.completed?.[num]?'✓ MODULE COMPLETED':'MARK MODULE COMPLETE →'}</button>`;
    app.appendChild(wrap);
  },0);
};

/* ===== SXL persistent navigation + theme ===== */
const SXL_UI_KEY="sxl_pen200_ui_v10";
function getSXLUI(){
 try{return JSON.parse(localStorage.getItem(SXL_UI_KEY))||{};}catch(e){return {};}
}
function saveSXLUI(o){localStorage.setItem(SXL_UI_KEY,JSON.stringify(o));}
function toggleSXLSidebar(){
 const collapsed=document.body.classList.toggle("sxl-sidebar-collapsed");
 const b=document.getElementById("sxlSidebarToggle");
 if(b){
   b.textContent=collapsed?"☰":"‹";
   b.setAttribute("title",collapsed?"Show sidebar":"Hide sidebar");
 }
 const u=getSXLUI();
 u.sidebarCollapsed=collapsed;
 saveSXLUI(u);
 window.dispatchEvent(new Event("resize"));
 window.scrollTo({top:0,left:0,behavior:"instant"});
}
function applySXLTheme(mode){
 const dark=mode==="dark";
 document.body.classList.toggle("sxl-dark",dark);
 const b=document.getElementById("sxlThemeToggle");
 if(b){b.textContent=dark?"☾":"☀";b.setAttribute("title",dark?"Switch to light mode":"Switch to dark mode");}
 const u=getSXLUI();u.theme=dark?"dark":"light";saveSXLUI(u);
}
function toggleSXLTheme(){applySXLTheme(document.body.classList.contains("sxl-dark")?"light":"dark");}
function initSXLUI(){
 const u=getSXLUI();
 const collapsed=u.sidebarCollapsed===true;
 document.body.classList.toggle("sxl-sidebar-collapsed",collapsed);
 const b=document.getElementById("sxlSidebarToggle");
 if(b){
   b.textContent=collapsed?"☰":"‹";
   b.setAttribute("title",collapsed?"Show sidebar":"Hide sidebar");
 }
 applySXLTheme(u.theme==="dark"?"dark":"light");
}

if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",initSXLUI);}else{initSXLUI();}
